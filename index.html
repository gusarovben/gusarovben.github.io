<!DOCTYPE html>
<html lang="ru">
<head>
    <meta name="yandex-verification" content="82a0c4111512f1b2" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>напиши письмо</title>
    <style>
        body {
            background-color: #FFFFFFFF;
            height: 100vh;
            margin: 0;
            font-size: 20px;
            font-family: Arial, sans-serif;
            position: relative;
        }
        .first-box{
            position: absolute;
            top: 5%;
            left: 25%;
            height: 75%;
            width: 50%;
            color: black;
            font-family: Arial, sans-serif;
            font-weight: bold;
        }
        .my-post{
            resize: none;
            height: 75%;
            width: 100%;
            color: black;
            font-size: 125%;
            font-family: Arial, sans-serif;
            font-weight: bold;
            border-radius: 7px;
        }
        .my-number{
            padding: 1% 1%;
            font-size: 20px;
            width: 200px;
            border: 2px solid #e94560;
            border-radius: 8px;
            background-color: #16213e;
            color: white;
            outline: none;
        }
        .send-button {
            background-color: #F7FF00FF;
            border: 3px solid black;
            color: black;
            padding: 1% 1%;
            font-size: 20px;
            border-radius: 7px;
            cursor: pointer;
            box-shadow: 2px 5px 0 #5F5F5FFF;
            transition: all 0.1s ease;
            text-transform: uppercase;
            letter-spacing: 10%;
            font-weight: bold;
        }
        .send-button:active {
            transform: translateX(1px);
            transform: translateY(4px);
            box-shadow: 1px 1px 0 #000000FF;
        }
        .element {
            margin: 5px 0px 10px 0px;
        }
        #status {
            color: black;
            font-size: 14px;
            min-height: 20px;
        }
        @media (max-width: 600px) {
                .first-box{
                position: absolute;
                top: 5%;
                left: 5%;
                height: 80%;
                width: 90%;
            }
        }
    </style>
</head>
<body>
    <div class="first-box">
        <text>Здравствуйте! Напишите письмо, потом отправьте его.</text>
        <textarea id="idpost" placeholder="Что вас беспокоит?" class="my-post" ></textarea>
        <div class="element"><input id="idnumber" type="tel" placeholder="+7 (XXX) XXX-XX-XX" maxlength="18" class="my-number"></div>
        <button id="idsendbutton" class="send-button">Передать привет</button>
        <div id="idstatus" class="element"></div>
    </div>
    <script>
        const mynumber = document.getElementById('idnumber');
        mynumber.addEventListener('input', (e) => {
            let value = mynumber.value.replace(/\D/g, '');
            if (value.length > 0 && value[0] !== '7') {
                value = '7' + value.slice(0, 10);
            }
            value = value.slice(0, 11);
            let formatted = '+7';
            if (value.length > 1) formatted += ' (' + value.slice(1, 4);
            if (value.length > 4) formatted += ') ' + value.slice(4, 7);
            if (value.length > 7) formatted += '-' + value.slice(7, 9);
            if (value.length > 9) formatted += '-' + value.slice(9, 11);
            mynumber.value = formatted;
        });
    </script>
    <script>
        const dbUrl = "https://ne-dolgiy-yaschik-default-rtdb.europe-west1.firebasedatabase.app/yaschik";
        const checkUrl = dbUrl + '.json?shallow=true';
        const sendbutton = document.getElementById('idsendbutton');
        const statusDiv = document.getElementById('idstatus');
        const mypost = document.getElementById('idpost');
        const months = [
            'january', 'february', 'march', 'april', 'may', 'june',
            'july', 'august', 'september', 'october', 'november', 'december'
        ];
        const maxcount = 3;
    </script>
    <script>
        sendbutton.addEventListener('click', async () => {
            sendbutton.disabled = true;
            statusDiv.textContent = "Проверяю всё...";
            try {
                //const getResponse = await fetch(dbUrl);
                //const data = await getResponse.json();
                //const currentCount = data.count || 0; // Если база пуста, начинаем с 0
                //const newCount = currentCount + 1;
                const newPost = mypost.value;
                const number = mynumber.value;
                const phone = mynumber.value.trim();
                const phoneRegex = /^\+7 \(\d{3}\) \d{3}-\d{2}-\d{2}$/;
                
                const checkResponse = await fetch(checkUrl);
                statusDiv.textContent = "Подключаюсь к базе.";
                const keys = await checkResponse.json();
                statusDiv.textContent = "Проверяю номер.";
                const checknumber = mynumber.value.trim().toLowerCase();

                const now = new Date();
                const monthName = months[now.getMonth()];
                const year = now.getFullYear();
                const datePrefix = monthName + year;

                let i = 1;
                const countcount = 0;
                while (i <= maxcount) {
                    const checkUrl1 = dbUrl + '/' + encodeURIComponent(number) + '.json?shallow=true';
                    const checkResponse1 = await fetch(checkUrl1);
                    const keys1 = await checkResponse1.json();
                    const countPrefix0 = 'count' + text(i);
                    const number1 = countPrefix0.value.trim().toLowerCase();
                    if (keys1 === null || !(number1 in keys1)) {
                        countcount = i;
                    }
                    i++;
                }
                const countPrefix = 'count' + text(countcount);
                
                if (newPost.trim() === '') {
                    statusDiv.style.color = 'red';
                    statusDiv.textContent = `Нельзя отправить пустое сообщение.`;
                } else if (!phoneRegex.test(phone)) {
                    statusDiv.style.color = 'red';
                    statusDiv.textContent = 'Введи телефон в формате +7 (XXX) XXX-XX-XX.';
                } else if (keys === null || !(checknumber in keys)) {
                    statusDiv.style.color = 'red';
                    statusDiv.textContent = 'Пользователь с таким номером не зарегистрирован.';
                } else if (i === maxcount) {
                    statusDiv.style.color = 'red';
                    statusDiv.textContent = 'Вы исчерпали свой лимит на этот месяц ' + text(maxcount) + ' штук.';
                } else {
                    const userUrl = dbUrl + '/' + encodeURIComponent(number) + '/' + encodeURIComponent(datePrefix) + '/' + encodeURIComponent(countPrefix) + '.json';
                    statusDiv.style.color = 'black';
                    statusDiv.textContent = "Отправляю письмо.";
                    const putResponse = await fetch(userUrl, {
                        method: 'PUT',
                        body: JSON.stringify({
                            text: newPost,
                            time: new Date().toLocaleString()
                        }),
                        headers: { 'Content-Type': 'application/json' }
                    });
                    if (putResponse.ok) {
                        statusDiv.style.color = 'green';
                        statusDiv.textContent = `Сообщение успешно отправлено!`;
                    } else {
                        throw new Error('Ошибка сохранения');
                    }
                }
            } 
            catch (error) {
                statusDiv.style.color = 'red';
                statusDiv.textContent = 'Ошибка связи с сервером.';
                console.error(error);
            }
            sendbutton.disabled = false;
        });
    </script>
</body>
</html>
