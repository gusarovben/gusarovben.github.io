<!DOCTYPE html>
<html lang="ru">
<head>
    <meta name="yandex-verification" content="82a0c4111512f1b2" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Желание народа</title>
    <style>
        body {
            background-color: #FFFFFFFF;
            /*color: black;*/
            /*display: flex;
            justify-content: center;
            align-items: center;*/
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            position: relative;
        }
        .cool-button {
            position: absolute;
            top: 75%;
            left: 25%;
            /*transform: translate(-50%, -50%);*/
            background-color: #F7FF00FF; /*#00DA00FF*/
            border: 3px solid black;
            color: black; /*white*/
            padding: 0.5% 1%;
            font-size: 125%;
            border-radius: 7px;
            cursor: pointer;
            box-shadow: 2px 5px 0 #5F5F5FFF; /*#005C00FF*/
            transition: all 0.1s ease;
            text-transform: uppercase;
            letter-spacing: 10%;
            font-weight: bold;
        }
        .cool-button:active {
            transform: translateX(1px);
            transform: translateY(4px);
            box-shadow: 1px 1px 0 #000000FF;
        }
        .first-box{
            position: absolute;
            top: 5%;
            left: 25%;
            bottom: 25%;
            color: black
            font-family: Arial, sans-serif;
            font-weight: bold;
        }
        .my-input{
            padding: 10px 15px;
            font-size: 18px;
            border: 2px solid #e94560;
            border-radius: 8px;
            background-color: #16213e;
            color: white;
            outline: none;
        }
        .my-input:focus {
            border-color: #ff6b81;
            box-shadow: 0 0 10px rgba(233, 69, 96, 0.5);
        }
        .my-post{
            position: absolute;
            top: 5%;
            left: 25%;
            bottom: 25%;
            color: black
            font-family: Arial, sans-serif;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="first-box">
        <text>
            Здравствуйте! Прошу вас об одном. НЕ НАЖИМАЙТЕ ЭТУ КНОПКУ!
        </text>
        <textarea placeholder="Что вас беспокоит?" class="my-post" >
        </textarea>
        <input type="text" placeholder="Твой номер" class="my-input">
    </div>
    <button class="cool-button" onclick="alert('Привет, Полина!')">
        Передать привет
    </button>
</body>
</html>
