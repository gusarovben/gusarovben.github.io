<!DOCTYPE html>
<html lang="ru">
<head>
    <meta name="yandex-verification" content="82a0c4111512f1b2" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>напиши письмо</title>
    <link rel="icon" type="image/png" href="/icon.jpg">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <script src="firebase-config.js"></script>
    <script>
        // Проверка авторизации
        const authPhone = localStorage.getItem('auth_phone');
        const authTime = localStorage.getItem('auth_time');
        const now = Date.now();
        
        // Если нет авторизации или прошло больше 24 часов — на вход
        if (!authPhone || !authTime || (now - parseInt(authTime)) > 86400000) {
            localStorage.removeItem('auth_phone');
            localStorage.removeItem('auth_time');
            window.location.href = 'login.html';
        }
    </script>
    <div class="first-box">
        <text>Здравствуйте! Напишите письмо, потом отправьте его.</text>
        <textarea id="idpost" placeholder="Что вас беспокоит?" class="my-post"></textarea>
        <div class="element"><input id="idnumber" type="tel" placeholder="+7 (XXX) XXX-XX-XX" maxlength="18" class="my-number"></div>
        <button id="idsendbutton" class="send-button">Передать привет</button>
        <div id="idstatus" class="element"></div>
    </div>

    <!-- Модальное окно -->
    <div class="overlay" id="confirmOverlay">
        <div class="modal">
            <p>Вы точно хотите отправить письмо?</p>
            <div class="modal-buttons">
                <button class="btn-yes" id="btnYes">Да</button>
                <button class="btn-no" id="btnNo">Нет</button>
            </div>
        </div>
    </div>
    //работает?
    <!-- Скрипты (порядок важен!) -->
    <script src="phone-mask.js"></script>
    <script src="modal.js"></script>
    <script src="main.js"></script>
    <button onclick="localStorage.clear(); window.location.href='login.html';" 
        style="position: fixed; bottom: 10px; right: 10px; background: red; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer;">
        Выйти
    </button>
</body>
</html>
