<!DOCTYPE html>
<html lang="ru">
<head>
    <meta name="yandex-verification" content="82a0c4111512f1b2" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>напиши письмо</title>
    <link rel="icon" type="image/png" href="/icon.jpg">
    <style>
        body {
            /*background-color: #FFFFFFFF;
            height: 100vh;
            margin: 0;
            font-size: 20px;
            font-family: Arial, sans-serif;
            position: relative;*/
            background-image: url('/background.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed; /* Фон не двигается при скролле */
            margin: 0;
            height: 100vh;
            font-family: Arial, sans-serif;
        }
        .first-box{
            position: absolute;
            top: 5%;
            left: 25%;
            height: 75%;
            width: 50%;
            color: black;
            font-family: Arial, sans-serif;
            font-weight: bold;
        }
        .my-post{
            resize: none;
            height: 75%;
            width: 100%;
            color: black;
            font-size: 125%;
            font-family: Arial, sans-serif;
            font-weight: bold;
            border-radius: 7px;
        }
        .my-number{
            padding: 1% 1%;
            font-size: 20px;
            width: 200px;
            border: 2px solid yellow;
            border-radius: 8px;
            background-color: black;
            color: white;
            outline: none;
        }
        .send-button {
            background-color: #F7FF00FF;
            border: 3px solid black;
            color: black;
            padding: 1% 1%;
            font-size: 20px;
            border-radius: 7px;
            cursor: pointer;
            box-shadow: 2px 5px 0 #5F5F5FFF;
            transition: all 0.1s ease;
            text-transform: uppercase;
            letter-spacing: 10%;
            font-weight: bold;
        }
        .send-button:active {
            transform: translateX(1px);
            transform: translateY(4px);
            box-shadow: 1px 1px 0 #000000FF;
        }
        .element {
            margin: 5px 0px 10px 0px;
        }
        #status {
            color: black;
            font-size: 14px;
            min-height: 20px;
        }
        @media (max-width: 600px) {
            .first-box{
                position: absolute;
                top: 5%;
                left: 5%;
                height: 80%;
                width: 90%;
            }
            .my-post{
                height: 50%;
            }
        }
    </style>
    <style>
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        .overlay.active {
            opacity: 1;
            visibility: visible;
        }
        .modal {
            background-color: black;
            border: 2px solid yellow;
            border-radius: 16px;
            padding: 30px 25px;
            text-align: center;
            max-width: 350px;
            width: 90%;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            transform: scale(0.8);
            transition: transform 0.3s ease;
        }
        .overlay.active .modal {
            transform: scale(1);
        }
        .modal p {
            color: white;
            font-size: 18px;
            margin: 0 0 25px 0;
            line-height: 1.5;
        }
        .modal-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
        }
        .btn-yes {
            background-color: yellow;
            color: black;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        .btn-yes:hover {
            background-color: #ff6b81;
        }
        .btn-no {
            background-color: transparent;
            color: yellow;
            border: 2px solid yellow;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s, color 0.2s;
        }
        .btn-no:hover {
            background-color: #a8dadc;
            color: #1a1a2e;
        }
    </style>
</head>
<body>
    <div class="first-box">
        <text>Здравствуйте! Напишите письмо, потом отправьте его.</text>
        <textarea id="idpost" placeholder="Что вас беспокоит?" class="my-post" ></textarea>
        <div class="element"><input id="idnumber" type="tel" placeholder="+7 (XXX) XXX-XX-XX" maxlength="18" class="my-number"></div>
        <button id="idsendbutton" class="send-button">Передать привет</button>
        <div id="idstatus" class="element"></div>
    </div>
        <div class="overlay" id="confirmOverlay">
        <div class="modal">
            <p>Вы точно хотите отправить письмо?</p>
            <div class="modal-buttons">
                <button class="btn-yes" id="btnYes">Да</button>
                <button class="btn-no" id="btnNo">Нет</button>
            </div>
        </div>
    </div>
    <script>
        const mynumber = document.getElementById('idnumber');
        mynumber.addEventListener('input', (e) => {
            let value = mynumber.value.replace(/\D/g, '');
            if (value.length > 0 && value[0] !== '7') {
                value = '7' + value.slice(0, 10);
            }
            value = value.slice(0, 11);
            let formatted = '+7';
            if (value.length > 1) formatted += ' (' + value.slice(1, 4);
            if (value.length > 4) formatted += ') ' + value.slice(4, 7);
            if (value.length > 7) formatted += '-' + value.slice(7, 9);
            if (value.length > 9) formatted += '-' + value.slice(9, 11);
            mynumber.value = formatted;
        });
    </script>
    <script>
        const dbUrl = "https://ne-dolgiy-yaschik-default-rtdb.europe-west1.firebasedatabase.app/yaschik";
        const checkNumderUrl = dbUrl + '.json?shallow=true';
        const sendbutton = document.getElementById('idsendbutton');
        const statusDiv = document.getElementById('idstatus');
        const mypost = document.getElementById('idpost');
        const months = [
            'january', 'february', 'march', 'april', 'may', 'june',
            'july', 'august', 'september', 'october', 'november', 'december'
        ];
        const maxcount = 100;
    </script>
    <script>
        const overlay = document.getElementById('confirmOverlay');
        const btnYes = document.getElementById('btnYes');
        const btnNo = document.getElementById('btnNo');
        function showConfirm() {
            return new Promise((resolve) => {
                overlay.classList.add('active');
        
                btnYes.onclick = () => {
                    overlay.classList.remove('active');
                    resolve(true);   // Вернули "да"
                };
        
                btnNo.onclick = () => {
                    overlay.classList.remove('active');
                    resolve(false);  // Вернули "нет"
                };
            });
        }
    </script>
    <script>
        sendbutton.addEventListener('click', async () => {
            sendbutton.disabled = true;
            statusDiv.style.color = 'black';
            statusDiv.textContent = "Проверяю всё...";
            try {
                //const getResponse = await fetch(dbUrl);
                //const data = await getResponse.json();
                //const currentCount = data.count || 0; // Если база пуста, начинаем с 0
                //const newCount = currentCount + 1;
                const newPost = mypost.value;
                if (newPost.trim() === '') {
                    statusDiv.style.color = 'red';
                    statusDiv.textContent = `Нельзя отправить пустое сообщение.`;
                    sendbutton.disabled = false;
                    return;
                }
                
                const number = mynumber.value;
                const checkphone = number.trim();
                const phoneMask = /^\+7 \(\d{3}\) \d{3}-\d{2}-\d{2}$/;
                if (!phoneMask.test(checkphone)) {
                    statusDiv.style.color = 'red';
                    statusDiv.textContent = 'Введите 10 цифр.'; //'Введи телефон в формате +7 (XXX) XXX-XX-XX.'
                    sendbutton.disabled = false;
                    return;
                }
                
                const checkNumderResponse = await fetch(checkNumderUrl);
                const numberkeys = await checkNumderResponse.json();
                const checknumber = number.trim().toLowerCase();
                if (numberkeys === null || !(checknumber in numberkeys)) {
                    statusDiv.style.color = 'red';
                    statusDiv.textContent = 'Пользователь с таким номером не зарегистрирован.';
                    sendbutton.disabled = false;
                    return;
                }

                const now = new Date();
                const monthName = months[now.getMonth()];
                const year = now.getFullYear();
                const datePrefix = monthName + year;
                const checkDateUrl = dbUrl + '/' + encodeURIComponent(number) + '.json?shallow=true';
                const checkDateResponse = await fetch(checkDateUrl);
                const datekeys = await checkDateResponse.json();
                const checkdate = datePrefix.trim().toLowerCase();
                if (!(checkdate in datekeys)) {
                    statusDiv.textContent = "Добавляю новый месяц...";
                    const dateUrl = dbUrl + '/' + encodeURIComponent(number) + '/' + encodeURIComponent(datePrefix) + '.json';
                    const putResponse = await fetch(dateUrl, {
                        method: 'PUT',
                        body: JSON.stringify({status: true}),
                        headers: { 'Content-Type': 'application/json' }
                    });
                }

                let i = 1;
                let countcount = 0;
                while (i <= maxcount + 1) {
                    const checkCountUrl = dbUrl + '/' + encodeURIComponent(number) + '/' + encodeURIComponent(datePrefix) + '.json?shallow=true';
                    const checkCountResponse = await fetch(checkCountUrl);
                    const countkeys = await checkCountResponse.json();
                    const countPrefix = 'count' + i;
                    const checkcount = countPrefix.trim().toLowerCase();
                    if (!(checkcount in countkeys)) {
                        countcount = i;
                        break;
                    }
                    i++;
                }
                const countPrefix = 'count' + countcount;
                if (countcount === maxcount + 1) {
                    statusDiv.style.color = 'red';
                    statusDiv.textContent = 'Вы исчерпали свой лимит на этот месяц ' + maxcount + ' штук.';
                    sendbutton.disabled = false;
                    const klvUrl = dbUrl + '/' + encodeURIComponent(number) + '/' + encodeURIComponent(datePrefix) + '/status.json';
                    const putResponse = await fetch(klvUrl, {
                        method: 'PUT',
                        body: JSON.stringify(false),
                        headers: { 'Content-Type': 'application/json' }
                    });
                    return;
                }
                const confirmed = await showConfirm();
                if (!confirmed) {
                    sendbutton.disabled = false;
                    statusDiv.textContent = "";
                    return; // Нажал «Нет» — выходим
                }
                const userUrl = dbUrl + '/' + encodeURIComponent(number) + '/' + encodeURIComponent(datePrefix) + '/' + encodeURIComponent(countPrefix) + '.json';
                statusDiv.style.color = 'black';
                statusDiv.textContent = "Отправляю письмо...";
                const putResponse = await fetch(userUrl, {
                    method: 'PUT',
                    body: JSON.stringify({
                        text: newPost,
                        time: new Date().toLocaleString()
                    }),
                    headers: { 'Content-Type': 'application/json' }
                });
                if (putResponse.ok) {
                    statusDiv.style.color = 'green';
                    statusDiv.textContent = 'Сообщение успешно отправлено! Вы можете отправить ещё ' + (maxcount - countcount) + '.';
                } else {
                    throw new Error('Ошибка сохранения');
                }
            } 
            catch (error) {
                statusDiv.style.color = 'red';
                statusDiv.textContent = 'Ошибка связи с сервером.';
                console.error(error);
            }
            sendbutton.disabled = false;
        });
    </script>
</body>
</html>
