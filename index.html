<!DOCTYPE html>
<html lang="ru">
<head>
    <meta name="yandex-verification" content="82a0c4111512f1b2" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мнение народа!</title>
    <style>
        
        body {
            background-color: #FFFFFFFF;
            //color: black;
            /*display: flex;
            justify-content: center;
            align-items: center;*/
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            position: relative;
        }
        .cool-button {
            position: absolute;
            top: 75%;
            left: 25%;
            //transform: translate(-50%, -50%);
            background-color: #F7FF00FF; //#00DA00FF
            border: 3px solid black;
            color: black; //white
            padding: 1% 2%;
            font-size: 125%;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 2px 5px 0 #5F5F5FFF; //#005C00FF
            transition: all 0.1s ease;
            text-transform: uppercase;
            letter-spacing: 10%;
            font-weight: bold;
        }
        .cool-button:active {
            transform: translateX(1px);
            transform: translateY(4px);
            box-shadow: 1px 1px 0 #000000FF;
        }
        .first-box{
            position: absolute;
            top: 5%;
            left: 25%;
            color: black
            font-family: Arial, sans-serif;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="first-box">
        <text>
            Здравствуйте! Прошу вас об одном. НЕ НАЖИМАЙТЕ ЭТУ КНОПКУ!
        </text>
    </div>
    <button class="cool-button" onclick="alert('Привет, Полина!')">
        Передать привет
    </button>
</body>
</html>
